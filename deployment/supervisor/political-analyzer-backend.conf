[program:political-analyzer-backend]
command=/opt/political-analyzer/app/backend/venv/bin/python -m uvicorn server:app --host 0.0.0.0 --port 8001 --workers 1
directory=/opt/political-analyzer/app/backend
user=www-data
group=www-data
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=10

# Logs
stdout_logfile=/opt/political-analyzer/logs/backend.log
stderr_logfile=/opt/political-analyzer/logs/backend.error.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_backups=5
redirect_stderr=false

# Variables d'environnement
environment=
    PYTHONPATH="/opt/political-analyzer/app/backend",
    PYTHONUNBUFFERED="1",
    NODE_ENV="production"

# Process management
priority=100
numprocs=1
killasgroup=true
stopasgroup=true