[program:political-analyzer-scheduler]
command=/opt/political-analyzer/app/backend/venv/bin/python scheduler.py
directory=/opt/political-analyzer/app/backend
user=www-data
group=www-data
autostart=true
autorestart=true
startsecs=10
startretries=5
stopwaitsecs=15

# Logs
stdout_logfile=/opt/political-analyzer/logs/scheduler.log
stderr_logfile=/opt/political-analyzer/logs/scheduler.error.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_backups=5
redirect_stderr=false

# Variables d'environnement
environment=
    PYTHONPATH="/opt/political-analyzer/app/backend",
    PYTHONUNBUFFERED="1",
    NODE_ENV="production"

# Process management
priority=200
numprocs=1
killasgroup=true
stopasgroup=true